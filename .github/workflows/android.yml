name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check and assemble unsigned release
        run: sh gradlew clean check assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasAppWidget-unsigned-release
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: ignore
